# 限制 JVM native 区，避免系统提交内存(commit)接近上限时 malloc 失败
# 注意：不要设 -Xss512k，栈过小会导致 Gradle daemon 握手线程崩溃连不上
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
# Kotlin 编译在 Gradle 进程内执行，避免单独 daemon JVM 占用 native memory 导致 OOM
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000
android.builder.sdkDownload=false
